name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Typecheck + Unit + Integration + Concurrency
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: slotbook
          POSTGRES_PASSWORD: slotbook
          POSTGRES_DB: slotbook
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgres://slotbook:slotbook@localhost:5432/slotbook
      APP_SECRET: ci-app-secret
      DEMO_HOST_PASSWORD: slotbook-demo
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Type-check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Migrate + Seed
        run: pnpm db:setup

      - name: Unit tests
        run: pnpm test:unit

      - name: Integration tests
        run: pnpm test:integration

      - name: Concurrency tests
        run: pnpm test:concurrency

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: test

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: slotbook
          POSTGRES_PASSWORD: slotbook
          POSTGRES_DB: slotbook
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgres://slotbook:slotbook@localhost:5432/slotbook
      APP_SECRET: ci-app-secret
      DEMO_HOST_PASSWORD: slotbook-demo
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Migrate + Seed
        run: pnpm db:setup

      - name: Build
        run: pnpm build

      - name: Start app
        run: pnpm start &
        env:
          PORT: 3000

      - name: Wait for app
        run: npx wait-on http://localhost:3000/api/health --timeout 30000

      - name: E2E tests
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
