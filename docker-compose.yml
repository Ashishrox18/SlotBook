services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: slotbook
      POSTGRES_PASSWORD: slotbook
      POSTGRES_DB: slotbook
    ports:
      - "5432:5432"
    volumes:
      - slotbook_pg:/var/lib/postgresql/data
      # Create a separate test database on first start
      - ./docker/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slotbook -d slotbook"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    image: slotbook-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://slotbook:slotbook@db:5432/slotbook
      APP_SECRET: dev-app-secret-change-me
      DEMO_HOST_PASSWORD: slotbook-demo
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    ports:
      - "3000:3000"
    command: sh -c "node_modules/.bin/tsx db/migrate.ts && node_modules/.bin/tsx db/seed.ts && node_modules/.bin/next start"

volumes:
  slotbook_pg:
